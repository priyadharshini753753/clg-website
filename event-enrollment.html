<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Event Enrollment | MI Club</title>
    <style>
      body {
        font-family: Arial;
        background: linear-gradient(135deg, #d7f7fa, #f8f4fa, #e3eaff);
        padding: 30px;
      }
      .box {
        max-width: 650px;
        margin: auto;
        background: #fff;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 18px 50px #0002;
      }
      .title {
        text-align: center;
        color: #563ed9;
        font-size: 30px;
        font-weight: 900;
      }
      .sub {
        text-align: center;
        color: #777;
        margin: 8px 0 25px;
      }
      .g {
        margin-bottom: 15px;
      }
      label {
        display: block;
        font-weight: 700;
        margin-bottom: 6px;
      }
      input,
      select {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 9px;
        box-sizing: border-box;
      }
      input[readonly] {
        background: #f4f4f4;
      }
      .btn {
        width: 100%;
        padding: 13px;
        border: 0;
        border-radius: 9px;
        background: #563ed9;
        color: #fff;
        font-weight: 800;
        margin-top: 6px;
        cursor: pointer;
      }
      .back {
        background: #fff;
        color: #555;
        border: 1px solid #ccc;
      }
      .msg {
        display: none;
        margin-top: 15px;
        padding: 12px;
        border-radius: 9px;
        text-align: center;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="title">𝓜𝓘 𝓒𝓛𝓤𝓑</div>
      <div class="sub">Event Enrollment</div>
      <form id="f">
        <div class="g"><label>Name</label><input id="name" readonly /></div>
        <div class="g">
          <label>Register Number</label><input id="reg" readonly />
        </div>
        <div class="g"><label>Batch</label><input id="batch" readonly /></div>
        <div class="g"><label>Domain</label><input id="domain" readonly /></div>
        <div class="g">
          <label>Event Type</label
          ><select id="type" required>
            <option value="">Select</option>
            <option>Inter College</option>
            <option>Outer College</option>
          </select>
        </div>
        <div class="g"><label>Venue</label><input id="venue" required /></div>
        <div class="g">
          <label>Participant Event</label
          ><select id="event" required>
            <option value="">Select</option>
            <option>Quiz</option>
            <option>Debugging</option>
            <option>Paper Presentation</option>
            <option>Code Relay</option>
            <option>Web Designing</option>
            <option>Logo Designing</option>
          </select>
        </div>
        <div class="g">
          <label>Status</label
          ><select id="status" required>
            <option value="">Select</option>
            <option>Winner</option>
            <option>Runner</option>
            <option>Participant</option>
          </select>
        </div>
        <div class="g">
          <label>Event Date</label><input type="date" id="date" required />
        </div>
        <button class="btn">Submit Event Enrollment</button
        ><button
          type="button"
          class="btn back"
          onclick="location.href = 'club-card.html'"
        >
          ← Back to Club Card
        </button>
      </form>
      <div id="msg" class="msg"></div>
    </div>
    <script>
      const API = "http://localhost:5000",
        p = JSON.parse(localStorage.getItem("miClubParticipant") || "null");
      if (!p) {
        alert("Please login first.");
        location.href = "signin.html";
      } else {
        ["name", "reg", "batch", "domain"].forEach(
          (id, i) =>
            (document.getElementById(id).value = [
              p.name,
              p.registerNumber,
              p.batch,
              p.domain,
            ][i]),
        );
      }
      document.getElementById("f").onsubmit = async (e) => {
        e.preventDefault();
        let body = {
          qrToken: p.qrToken,
          eventType: type.value,
          venue: venue.value.trim(),
          participantEvent: event.value,
          status: status.value,
          eventDate: date.value,
        };
        try {
          let r = await fetch(API + "/event-enroll", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body),
            }),
            d = await r.json();
          msg.textContent = (r.ok ? "✅ " : "❌ ") + (d.message || "Failed");
          msg.style.display = "block";
          msg.style.background = r.ok ? "#e8f8ee" : "#fff0f0";
          if (r.ok) e.target.reset();
        } catch (x) {
          alert("❌ Cannot connect to server.");
        }
      };
    </script>
  </body>
</html>
