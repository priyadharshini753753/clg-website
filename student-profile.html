<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MI Club Student Profile</title>
    <style>
      body {
        font-family: Arial;
        background: linear-gradient(135deg, #d7f7fa, #f8f4fa, #e3eaff);
        padding: 25px;
      }
      .box {
        max-width: 850px;
        margin: auto;
        background: #fff;
        padding: 28px;
        border-radius: 20px;
        box-shadow: 0 18px 50px #0002;
      }
      .title {
        text-align: center;
        color: #563ed9;
        font-size: 30px;
        font-weight: 900;
      }
      .student {
        text-align: center;
        line-height: 1.8;
        margin: 20px;
      }
      .table {
        width: 100%;
        border-collapse: collapse;
      }
      .table th,
      .table td {
        border: 1px solid #ddd;
        padding: 10px;
      }
      .table th {
        background: #f0edfd;
        color: #563ed9;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="title">𝓜𝓘 𝓒𝓛𝓤𝓑</div>
      <h2 style="text-align: center">Student Profile & Event History</h2>
      <div id="student">Loading...</div>
      <div id="events"></div>
    </div>
    <script>
      const t = new URLSearchParams(location.search).get("token");
      fetch("http://localhost:5000/api/student/" + encodeURIComponent(t || ""))
        .then((r) => r.json().then((d) => ({ ok: r.ok, d })))
        .then((x) => {
          if (!x.ok) throw Error();
          let s = x.d.student;
          student.innerHTML =
            '<div class="student"><b>' +
            esc(s.name) +
            "</b><br>Register Number: " +
            esc(s.register_number) +
            "<br>Batch: " +
            esc(s.batch) +
            " · Domain: " +
            esc(s.domain) +
            "</div>";
          if (!x.d.events.length) {
            events.innerHTML =
              '<p style="text-align:center">No event enrollment found.</p>';
            return;
          }
          events.innerHTML =
            '<table class="table"><tr><th>Date</th><th>Event</th><th>Type</th><th>Venue</th><th>Status</th></tr>' +
            x.d.events
              .map(
                (e) =>
                  "<tr><td>" +
                  esc(new Date(e.event_date).toLocaleDateString("en-GB")) +
                  "</td><td>" +
                  esc(e.participant_event) +
                  "</td><td>" +
                  esc(e.event_type) +
                  "</td><td>" +
                  esc(e.venue) +
                  "</td><td>" +
                  esc(e.status) +
                  "</td></tr>",
              )
              .join("") +
            "</table>";
        })
        .catch(() => (student.textContent = "Unable to load student profile."));
      function esc(v) {
        return String(v ?? "").replace(
          /[&<>"']/g,
          (m) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;",
            })[m],
        );
      }
    </script>
  </body>
</html>
