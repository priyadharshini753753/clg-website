<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sign In | MI Club</title>

    <style>
      /* =========================================
       GLOBAL
    ========================================= */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        color: #222;

        background: #111;

        position: relative;
        overflow-x: hidden;
      }

      /* =========================================
       FULL SCREEN VIDEO BACKGROUND
    ========================================= */

      .video-background {
        position: fixed;
        inset: 0;

        width: 100%;
        height: 100%;

        z-index: -2;

        overflow: hidden;

        pointer-events: none;

        background: #111;
      }

      .video-background video {
        width: 100%;
        height: 100%;

        object-fit: cover;
        object-position: center;

        display: block;
      }

      .video-overlay {
        position: absolute;
        inset: 0;

        background: rgba(20, 35, 55, 0.42);

        backdrop-filter: blur(1px);
        -webkit-backdrop-filter: blur(1px);
      }

      /* =========================================
       HEADER / NAVBAR
    ========================================= */

      .top-header {
        width: 100%;
        height: 85px;

        display: flex;
        align-items: center;

        padding: 0 40px;

        background: rgba(10, 10, 20, 0.45);

        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);

        border-bottom: 1px solid rgba(255, 255, 255, 0.18);

        position: sticky;
        top: 0;

        z-index: 1000;
      }

      /* =========================================
       NAVBAR CONTAINER
    ========================================= */

      .nav-container {
        width: 100%;
        max-width: 1500px;

        margin: 0 auto;

        display: flex;
        align-items: center;

        justify-content: space-between;

        gap: 25px;
      }

      /* =========================================
       LEFT SIDE - LOGOS
    ========================================= */

      .navbar-logos {
        display: flex;
        align-items: center;

        gap: 12px;

        flex-shrink: 0;
      }

      .navbar-logo {
        width: 65px;
        height: 65px;

        display: flex;
        align-items: center;
        justify-content: center;

        flex-shrink: 0;
      }

      .navbar-logo img {
        width: 60px;
        height: 60px;

        object-fit: contain;

        display: block;

        transition: 0.3s ease;
      }

      .navbar-logo img:hover {
        transform: scale(1.08);
      }

      /* =========================================
       CENTER - NAVIGATION LINKS
    ========================================= */

      .nav-links {
        flex: 1;

        display: flex;
        align-items: center;
        justify-content: center;

        gap: 42px;

        margin: 0 25px;
      }

      .nav-links a {
        text-decoration: none;

        color: #ffffff;

        font-size: 16px;
        font-weight: 600;

        white-space: nowrap;

        transition: 0.3s ease;
      }

      .nav-links a:hover {
        color: #c8baff;

        transform: translateY(-2px);
      }

      /* =========================================
       RIGHT SIDE - SIGN IN
    ========================================= */

      .signin {
        flex-shrink: 0;

        text-decoration: none;

        background: #563ed9;

        color: #ffffff;

        padding: 12px 24px;

        border-radius: 10px;

        font-size: 15px;
        font-weight: 700;

        white-space: nowrap;

        transition: 0.3s ease;

        box-shadow: 0 6px 18px rgba(86, 62, 217, 0.3);
      }

      .signin:hover {
        background: #432bc0;

        transform: translateY(-2px);

        box-shadow: 0 10px 25px rgba(86, 62, 217, 0.4);
      }

      /* =========================================
       SIGN IN PAGE
    ========================================= */

      .signin-page {
        width: 100%;

        min-height: calc(100vh - 85px);

        display: flex;

        justify-content: center;

        align-items: flex-start;

        padding: 45px 20px 70px;

        position: relative;

        z-index: 2;
      }

      /* =========================================
       MAIN SIGN IN PLATFORM
    ========================================= */

      .container {
        width: 100%;

        max-width: 540px;

        background: rgba(255, 255, 255, 0.95);

        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);

        padding: 40px;

        border-radius: 24px;

        border: 1px solid rgba(255, 255, 255, 0.75);

        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.25);

        animation: platformAppear 0.6s ease;
      }

      @keyframes platformAppear {
        from {
          opacity: 0;
          transform: translateY(25px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* =========================================
       CLUB HEADER
    ========================================= */

      .club-title {
        text-align: center;

        font-size: 34px;

        font-weight: 800;

        color: #563ed9;

        margin-bottom: 7px;

        letter-spacing: 1px;
      }

      .subtitle {
        text-align: center;

        color: #777;

        font-size: 15px;

        margin-bottom: 32px;
      }

      /* =========================================
       FORM
    ========================================= */

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;

        font-size: 14px;

        font-weight: 700;

        color: #333;

        margin-bottom: 8px;
      }

      input,
      select {
        width: 100%;

        padding: 14px 15px;

        border: 1px solid #d8d8d8;

        border-radius: 11px;

        background: #fff;

        font-size: 15px;

        outline: none;

        transition: 0.25s;
      }

      input:focus,
      select:focus {
        border-color: #563ed9;

        box-shadow: 0 0 0 3px rgba(86, 62, 217, 0.1);
      }

      /* =========================================
       REGISTER NUMBER PREFIX
    ========================================= */

      .reg-number-row {
        display: flex;

        align-items: center;

        gap: 8px;
      }

      .reg-prefix {
        flex-shrink: 0;

        min-width: 52px;

        text-align: center;

        padding: 14px 10px;

        border-radius: 11px;

        background: #f0edfd;

        color: #563ed9;

        font-weight: 700;

        font-size: 15px;

        border: 1px solid #d8d8d8;
      }

      .reg-number-row input {
        flex: 1;
      }

      /* =========================================
       SUBMIT BUTTON
    ========================================= */

      .submit-btn {
        width: 100%;

        padding: 14px;

        border: none;

        border-radius: 11px;

        background: #563ed9;

        color: white;

        font-size: 16px;

        font-weight: 700;

        cursor: pointer;

        transition: 0.25s;

        box-shadow: 0 8px 18px rgba(86, 62, 217, 0.22);
      }

      .submit-btn:hover {
        background: #432bc0;

        transform: translateY(-1px);
      }

      /* =========================================
       SUCCESS MESSAGE
    ========================================= */

      .success-message {
        display: none;

        margin-top: 18px;

        padding: 14px;

        border-radius: 10px;

        background: #e8f8ee;

        color: #16803c;

        text-align: center;

        font-size: 14px;

        font-weight: 700;
      }

      /* =========================================
       DIVIDER
    ========================================= */

      .divider {
        display: flex;

        align-items: center;

        gap: 12px;

        margin: 30px 0 22px;

        color: #999;

        font-size: 13px;

        font-weight: 600;
      }

      .divider::before,
      .divider::after {
        content: "";

        flex: 1;

        height: 1px;

        background: #ddd;
      }

      /* =========================================
       LOGIN SECTION
    ========================================= */

      .login-section {
        text-align: center;
      }

      .login-section p {
        color: #666;

        font-size: 14px;

        margin-bottom: 12px;
      }

      .login-btn {
        width: 100%;

        padding: 13px;

        border: 2px solid #563ed9;

        border-radius: 11px;

        background: white;

        color: #563ed9;

        font-size: 15px;

        font-weight: 700;

        cursor: pointer;

        transition: 0.25s;
      }

      .login-btn:hover {
        background: #563ed9;

        color: white;
      }

      /* =========================================
       LOGIN BOX
    ========================================= */

      #loginBox {
        display: none;

        margin-top: 28px;

        padding-top: 28px;

        border-top: 1px solid #e0e0e0;

        animation: loginAppear 0.4s ease;
      }

      @keyframes loginAppear {
        from {
          opacity: 0;
          transform: translateY(10px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .login-title {
        text-align: center;

        color: #333;

        font-size: 23px;

        margin-bottom: 22px;
      }

      /* =========================================
       LOGIN BUTTON
    ========================================= */

      .login-submit-btn {
        width: 100%;

        padding: 14px;

        border: none;

        border-radius: 11px;

        background: #563ed9;

        color: white;

        font-size: 16px;

        font-weight: 700;

        cursor: pointer;

        transition: 0.25s;
      }

      .login-submit-btn:hover {
        background: #432bc0;

        transform: translateY(-1px);
      }

      /* =========================================
       LOGIN ERROR
    ========================================= */

      .login-error {
        display: none;

        margin-top: 14px;

        padding: 12px;

        border-radius: 9px;

        background: #fff0f0;

        color: #d93030;

        text-align: center;

        font-size: 13px;

        font-weight: 600;
      }

      /* =========================================
       EVENTS BOX
    ========================================= */

      #eventsBox {
        display: none;

        margin-top: 30px;

        padding-top: 25px;

        border-top: 1px solid #ddd;

        animation: eventsAppear 0.4s ease;
      }

      @keyframes eventsAppear {
        from {
          opacity: 0;
          transform: translateY(10px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .events-title {
        text-align: center;

        font-size: 22px;

        color: #333;

        margin-bottom: 8px;
      }

      .participant-details {
        text-align: center;

        color: #777;

        font-size: 14px;

        line-height: 1.7;

        margin-bottom: 20px;
      }

      /* =========================================
       EVENT LIST
    ========================================= */

      #eventList {
        display: flex;

        flex-direction: column;

        gap: 10px;
      }

      .event-item {
        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 10px;

        padding: 14px 16px;

        background: #f5f2ff;

        border: 1px solid #e6e0ff;

        border-radius: 11px;

        color: #563ed9;

        font-size: 15px;

        font-weight: 700;
      }

      .event-check {
        width: 23px;

        height: 23px;

        display: flex;

        align-items: center;

        justify-content: center;

        border-radius: 50%;

        background: #563ed9;

        color: white;

        font-size: 13px;

        flex-shrink: 0;
      }

      /* =========================================
       CLUB CARD BUTTON
    ========================================= */

      .club-card-btn {
        width: 100%;

        margin-top: 18px;

        padding: 13px;

        border: none;

        border-radius: 10px;

        background: #563ed9;

        color: white;

        font-size: 14px;

        font-weight: 700;

        cursor: pointer;

        transition: 0.25s;
      }

      .club-card-btn:hover {
        background: #432bc0;

        transform: translateY(-1px);
      }

      /* =========================================
       BACK BUTTON
    ========================================= */

      .back-btn {
        width: 100%;

        margin-top: 12px;

        padding: 12px;

        border: 1px solid #ccc;

        border-radius: 10px;

        background: white;

        color: #555;

        font-size: 14px;

        font-weight: 600;

        cursor: pointer;

        transition: 0.2s;
      }

      .back-btn:hover {
        background: #f5f5f5;
      }

      /* =========================================
       MOBILE
    ========================================= */

      @media (max-width: 1000px) {
        .nav-links {
          gap: 22px;

          margin: 0 15px;
        }

        .nav-links a {
          font-size: 14px;
        }

        .top-header {
          padding: 0 20px;
        }
      }

      @media (max-width: 760px) {
        .top-header {
          height: auto;

          padding: 14px 18px;
        }

        .nav-container {
          flex-wrap: wrap;

          justify-content: center;

          gap: 14px;
        }

        .navbar-logos {
          width: 100%;

          justify-content: center;
        }

        .nav-links {
          order: 3;

          width: 100%;

          margin: 5px 0 0;

          gap: 18px;

          overflow-x: auto;

          justify-content: flex-start;

          padding-bottom: 5px;
        }

        .nav-links a {
          font-size: 13px;
        }

        .signin {
          position: absolute;

          right: 18px;
          top: 18px;
        }

        .signin-page {
          padding-top: 30px;
        }
      }

      @media (max-width: 600px) {
        .signin-page {
          padding: 25px 14px 50px;
        }

        .container {
          padding: 28px 22px;

          border-radius: 18px;
        }

        .club-title {
          font-size: 29px;
        }

        .subtitle {
          font-size: 14px;
        }

        .navbar-logo {
          width: 55px;
          height: 55px;
        }

        .navbar-logo img {
          width: 52px;
          height: 52px;
        }

        .signin {
          padding: 9px 15px;

          font-size: 13px;
        }
      }

      @media (max-width: 430px) {
        .nav-links {
          gap: 15px;
        }

        .nav-links a {
          font-size: 12px;
        }

        .container {
          padding: 25px 18px;
        }

        .club-title {
          font-size: 26px;
        }
      }
    </style>
  </head>

  <body>
    <!-- =========================================
       VIDEO BACKGROUND
  ========================================= -->

    <div class="video-background">
      <video autoplay muted loop playsinline preload="auto">
        <source src="images/cosmic.mp4" type="video/mp4" />
      </video>

      <div class="video-overlay"></div>
    </div>

    <!-- =========================================
       HEADER / NAVBAR
  ========================================= -->

    <header class="top-header">
      <div class="nav-container">
        <!-- LEFT : LOGOS -->

        <div class="navbar-logos">
          <div class="navbar-logo">
            <img src="images/mcwlogo.png" alt="Mangayarkarasi College Logo" />
          </div>

          <div class="navbar-logo">
            <img src="images/logo3.png" alt="MI Club Logo" />
          </div>
        </div>

        <!-- CENTER : NAVIGATION -->

        <nav class="nav-links">
          <a href="index.html"> Home </a>

          <a href="about.html"> About </a>

          <a href="events.html"> Events </a>

          <a href="staff.html"> Faculties </a>

          <a href="council.html"> Council Members </a>

          <a href="contact.html"> Contact </a>
        </nav>

        <!-- RIGHT : SIGN IN -->

        <a href="signin.html" class="signin"> Sign In </a>
      </div>
    </header>

    <!-- =========================================
       SIGN IN PLATFORM
  ========================================= -->

    <main class="signin-page">
      <div class="container">
        <!-- =====================================
           CLUB TITLE
      ====================================== -->

        <h1 class="club-title">𝓜𝓘 𝓒𝓛𝓤𝓑</h1>

        <p class="subtitle">Participant Registration &amp; Sign In</p>

        <!-- =====================================
           REGISTRATION FORM
      ====================================== -->

        <form id="registrationForm">
          <!-- NAME -->

          <div class="form-group">
            <label for="name"> Name </label>

            <input
              type="text"
              id="name"
              placeholder="Enter your name"
              required
            />
          </div>

          <!-- BATCH -->

          <div class="form-group">
            <label for="batch"> Batch </label>

            <select id="batch" required>
              <option value="">Select batch</option>

              <option value="2024-2027">2024 – 2027</option>

              <option value="2025-2028">2025 – 2028</option>

              <option value="2026-2029">2026 – 2029</option>
            </select>
          </div>

          <!-- DOMAIN -->

          <div class="form-group">
            <label for="domain"> Domain / Department </label>

            <select id="domain" required>
              <option value="">Select domain</option>

              <option value="CS">CS</option>

              <option value="AI">AI</option>

              <option value="BCA">BCA</option>

              <option value="DSA">DSA</option>
            </select>
          </div>

          <!-- REGISTER NUMBER -->

          <div class="form-group">
            <label for="regNumber"> Register Number </label>

            <div class="reg-number-row">
              <span class="reg-prefix" id="regPrefix"> — </span>

              <input
                type="text"
                id="regNumber"
                placeholder="Enter remaining digits"
                required
              />
            </div>
          </div>

          <!-- EVENT -->

          <div class="form-group">
            <label for="event"> Participated Event </label>

            <select id="event" required>
              <option value="">Select an event</option>

              <option value="Quiz">Quiz</option>

              <option value="Debugging">Debugging</option>

              <option value="Paper Presentation">Paper Presentation</option>

              <option value="Code Relay">Code Relay</option>

              <option value="Web Designing">Web Designing</option>

              <option value="Logo Designing">Logo Designing</option>
            </select>
          </div>

          <!-- SUBMIT -->

          <button type="submit" class="submit-btn">Submit Registration</button>
        </form>

        <!-- =====================================
           SUCCESS MESSAGE
      ====================================== -->

        <div class="success-message" id="successMessage">
          ✅ Registration Submitted Successfully!
        </div>

        <!-- =====================================
           DIVIDER
      ====================================== -->

        <div class="divider">OR</div>

        <!-- =====================================
           LOGIN SECTION
      ====================================== -->

        <div class="login-section">
          <p>Already signed in?</p>

          <button type="button" class="login-btn" onclick="showLogin()">
            Login
          </button>
        </div>

        <!-- =====================================
           LOGIN FORM
      ====================================== -->

        <div id="loginBox">
          <h2 class="login-title">Participant Login</h2>

          <!-- LOGIN NAME -->

          <div class="form-group">
            <label for="loginName"> Name </label>

            <input type="text" id="loginName" placeholder="Enter your name" />
          </div>

          <!-- LOGIN BATCH -->

          <div class="form-group">
            <label for="loginBatch"> Batch </label>

            <select id="loginBatch">
              <option value="">Select batch</option>

              <option value="2024-2027">2024 – 2027</option>

              <option value="2025-2028">2025 – 2028</option>

              <option value="2026-2029">2026 – 2029</option>
            </select>
          </div>

          <!-- LOGIN REGISTER NUMBER -->

          <div class="form-group">
            <label for="loginRegNumber"> Register Number </label>

            <input
              type="text"
              id="loginRegNumber"
              placeholder="Enter your register number"
            />
          </div>

          <!-- LOGIN BUTTON -->

          <button
            type="button"
            class="login-submit-btn"
            onclick="loginParticipant()"
          >
            Login
          </button>

          <!-- LOGIN ERROR -->

          <div class="login-error" id="loginError">
            ❌ Invalid Name, Batch or Register Number
          </div>
        </div>

        <!-- =====================================
           PARTICIPATED EVENTS
      ====================================== -->

        <div id="eventsBox">
          <h2 class="events-title">My Participated Events</h2>

          <p class="participant-details" id="participantDetails"></p>

          <div id="eventList"></div>

          <!-- CLUB CARD -->

          <button type="button" class="club-card-btn" onclick="openClubCard()">
            🪪 Create / View Club Card
          </button>

          <!-- BACK -->

          <button type="button" class="back-btn" onclick="logoutParticipant()">
            ← Back
          </button>
        </div>
      </div>
    </main>

    <!-- =========================================
       JAVASCRIPT
  ========================================= -->

    <script>
      /* ==========================================
       BACKEND URL
    ========================================== */

      const API_URL = "http://localhost:5000";

      /* ==========================================
       DOMAIN → REGISTER NUMBER PREFIX
    ========================================== */

      const DOMAIN_PREFIX = {
        CS: "C4S208",

        AI: "a3s",

        BCA: "C4S204",

        DSA: "C5S206",
      };

      /* ==========================================
       DOMAIN CHANGE
    ========================================== */

      document.getElementById("domain").addEventListener("change", function () {
        const prefix = DOMAIN_PREFIX[this.value] || "—";

        document.getElementById("regPrefix").textContent = prefix;
      });

      /* ==========================================
       REGISTRATION
    ========================================== */

      document
        .getElementById("registrationForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          const name = document.getElementById("name").value.trim();

          const batch = document.getElementById("batch").value;

          const domain = document.getElementById("domain").value;

          const prefix = DOMAIN_PREFIX[domain] || "";

          const regNumberSuffix = document
            .getElementById("regNumber")
            .value.trim();

          const registerNumber = prefix + regNumberSuffix;

          const selectedEvent = document.getElementById("event").value;

          if (!domain) {
            alert("❌ Please select a domain first.");

            return;
          }

          try {
            const response = await fetch(`${API_URL}/register`, {
              method: "POST",

              headers: {
                "Content-Type": "application/json",
              },

              body: JSON.stringify({
                name: name,

                registerNumber: registerNumber,

                batch: batch,

                domain: domain,

                event: selectedEvent,
              }),
            });

            const data = await response.json();

            /* REGISTRATION FAILED */

            if (!response.ok) {
              alert("❌ " + data.message);

              return;
            }

            /* SUCCESS */

            document.getElementById("successMessage").style.display = "block";

            document.getElementById("successMessage").innerHTML =
              "✅ Registration Submitted Successfully!";

            /* CLEAR FORM */

            document.getElementById("registrationForm").reset();

            document.getElementById("regPrefix").textContent = "—";

            /* HIDE SUCCESS MESSAGE */

            setTimeout(function () {
              document.getElementById("successMessage").style.display = "none";
            }, 4000);
          } catch (error) {
            console.error(error);

            alert(
              "❌ Cannot connect to server. " +
                "Please make sure backend is running.",
            );
          }
        });

      /* ==========================================
       SHOW LOGIN
    ========================================== */

      function showLogin() {
        document.getElementById("loginBox").style.display = "block";

        document.getElementById("eventsBox").style.display = "none";

        document.getElementById("loginBox").scrollIntoView({
          behavior: "smooth",

          block: "center",
        });
      }

      /* ==========================================
       LOGIN
    ========================================== */

      async function loginParticipant() {
        const loginName = document.getElementById("loginName").value.trim();

        const loginBatch = document.getElementById("loginBatch").value;

        const loginRegNumber = document
          .getElementById("loginRegNumber")
          .value.trim();

        const loginError = document.getElementById("loginError");

        if (!loginName || !loginBatch || !loginRegNumber) {
          loginError.style.display = "block";

          loginError.innerHTML =
            "❌ Please enter Name, Batch and Register Number.";

          return;
        }

        try {
          const response = await fetch(`${API_URL}/login`, {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({
              name: loginName,

              batch: loginBatch,

              registerNumber: loginRegNumber,
            }),
          });

          const data = await response.json();

          /* LOGIN FAILED */

          if (!response.ok) {
            loginError.style.display = "block";

            loginError.innerHTML =
              "❌ " +
              (data.message || "Invalid Name, Batch or Register Number");

            document.getElementById("eventsBox").style.display = "none";

            return;
          }

          /* LOGIN SUCCESS */

          loginError.style.display = "none";

          const participant = data.participant;

          /* SAVE PARTICIPANT */

          localStorage.setItem(
            "miClubParticipant",
            JSON.stringify(participant),
          );

          /* SHOW EVENTS */

          document.getElementById("eventsBox").style.display = "block";

          /* PARTICIPANT DETAILS */

          document.getElementById("participantDetails").innerHTML =
            `<strong>${participant.name}</strong>
           <br>
           Register Number: ${participant.registerNumber}
           <br>
           Batch: ${participant.batch || "—"}
           · Domain: ${participant.domain || "—"}`;

          /* EVENT LIST */

          const eventList = document.getElementById("eventList");

          eventList.innerHTML = "";

          participant.events.forEach(function (item) {
            const eventItem = document.createElement("div");

            eventItem.className = "event-item";

            const eventDate = new Date(item.submittedAt);

            const formattedDate = eventDate.toLocaleDateString("en-GB", {
              day: "2-digit",

              month: "short",

              year: "numeric",
            });

            eventItem.innerHTML = `<span class="event-check">
                  ✓
               </span>

               <span style="flex:1;">
                  ${item.event}
               </span>

               <span
                 style="
                   font-size:12px;
                   color:#8878c9;
                   font-weight:500;
                 ">

                 ${formattedDate}

               </span>`;

            eventList.appendChild(eventItem);
          });

          /* SCROLL TO EVENTS */

          document.getElementById("eventsBox").scrollIntoView({
            behavior: "smooth",

            block: "center",
          });
        } catch (error) {
          console.error(error);

          loginError.style.display = "block";

          loginError.innerHTML =
            "❌ Cannot connect to server. Please make sure backend is running.";
        }
      }

      /* ==========================================
       OPEN CLUB CARD
    ========================================== */

      function openClubCard() {
        window.location.href = "club-card.html";
      }

      /* ==========================================
       LOGOUT / BACK
    ========================================== */

      function logoutParticipant() {
        document.getElementById("eventsBox").style.display = "none";

        document.getElementById("loginBox").style.display = "none";

        document.getElementById("loginName").value = "";

        document.getElementById("loginBatch").value = "";

        document.getElementById("loginRegNumber").value = "";

        document.getElementById("loginError").style.display = "none";

        window.scrollTo({
          top: 0,

          behavior: "smooth",
        });
      }
    </script>
  </body>
</html>
