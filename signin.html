<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sign In | MI Club</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;

        background:
          radial-gradient(circle at top left, #d7f7fa, transparent 45%),
          radial-gradient(circle at bottom right, #e3eaff, transparent 45%),
          #f8f4fa;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        padding: 30px;
      }


      /* TOP NAVIGATION */
      .top-nav {
        width: 100%;
        max-width: 520px;
        margin: 0 auto 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }

      .top-nav a {
        text-decoration: none;
        color: #563ed9;
        font-size: 13px;
        font-weight: 700;
        padding: 9px 12px;
        border-radius: 9px;
        background: rgba(255,255,255,0.8);
        border: 1px solid #e5e0fb;
      }

      .top-nav a:hover {
        background: #563ed9;
        color: #fff;
      }

      /* MAIN CONTAINER */

      .container {
        width: 100%;
        max-width: 520px;

        background: rgba(255, 255, 255, 0.92);

        padding: 40px;

        border-radius: 24px;

        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);

        border: 1px solid rgba(255, 255, 255, 0.8);
      }

      /* HEADER */

      .club-title {
        text-align: center;

        font-size: 32px;

        font-weight: 800;

        color: #563ed9;

        margin-bottom: 8px;
      }

      .subtitle {
        text-align: center;

        color: #000;

        font-size: 15px;

        margin-bottom: 30px;
      }

      /* FORM */

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;

        font-size: 14px;

        font-weight: 700;

        color: #000;

        margin-bottom: 8px;
      }

      input,
      select {
        width: 100%;

        padding: 14px 15px;

        border: 1px solid #d8d8d8;

        border-radius: 11px;

        background: #fff;

        font-size: 15px;

        outline: none;

        transition: 0.25s;
      }

      input:focus,
      select:focus {
        border-color: #563ed9;

        box-shadow: 0 0 0 3px rgba(86, 62, 217, 0.1);
      }

      /* REGISTER NUMBER PREFIX */

      .reg-number-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .reg-prefix {
        flex-shrink: 0;
        min-width: 52px;
        text-align: center;
        padding: 14px 10px;
        border-radius: 11px;
        background: #f0edfd;
        color: #563ed9;
        font-weight: 700;
        font-size: 15px;
        border: 1px solid #d8d8d8;
      }

      .reg-number-row input {
        flex: 1;
      }

      /* SUBMIT BUTTON */

      .submit-btn {
        width: 100%;

        padding: 14px;

        border: none;

        border-radius: 11px;

        background: #563ed9;

        color: white;

        font-size: 16px;

        font-weight: 700;

        cursor: pointer;

        transition: 0.25s;
      }

      .submit-btn:hover {
        background: #432bc0;

        transform: translateY(-1px);
      }

      /* SUCCESS MESSAGE */

      .success-message {
        display: none;

        margin-top: 18px;

        padding: 14px;

        border-radius: 10px;

        background: #e8f8ee;

        color: #16803c;

        text-align: center;

        font-size: 14px;

        font-weight: 700;
      }

      /* DIVIDER */

      .divider {
        display: flex;

        align-items: center;

        gap: 12px;

        margin: 30px 0 22px;

        color: #999;

        font-size: 13px;
      }

      .divider::before,
      .divider::after {
        content: "";

        flex: 1;

        height: 1px;

        background: #ddd;
      }

      /* LOGIN SECTION */

      .login-section {
        text-align: center;
      }

      .login-section p {
        color: #666;

        font-size: 14px;

        margin-bottom: 12px;
      }

      .login-btn {
        width: 100%;

        padding: 13px;

        border: 2px solid #563ed9;

        border-radius: 11px;

        background: white;

        color: #563ed9;

        font-size: 15px;

        font-weight: 700;

        cursor: pointer;

        transition: 0.25s;
      }

      .login-btn:hover {
        background: #563ed9;

        color: white;
      }

      /* LOGIN BOX */

      #loginBox {
        display: none;

        margin-top: 28px;

        padding-top: 28px;

        border-top: 1px solid #e0e0e0;
      }

      .login-title {
        text-align: center;

        color: #000;

        font-size: 23px;

        margin-bottom: 22px;
      }

      /* LOGIN BUTTON */

      .login-submit-btn {
        width: 100%;

        padding: 14px;

        border: none;

        border-radius: 11px;

        background: #563ed9;

        color: white;

        font-size: 16px;

        font-weight: 700;

        cursor: pointer;

        transition: 0.25s;
      }

      .login-submit-btn:hover {
        background: #432bc0;

        transform: translateY(-1px);
      }

      /* LOGIN ERROR */

      .login-error {
        display: none;

        margin-top: 14px;

        padding: 12px;

        border-radius: 9px;

        background: #fff0f0;

        color: #d93030;

        text-align: center;

        font-size: 13px;

        font-weight: 600;
      }

      /* EVENTS BOX */

      #eventsBox {
        display: none;

        margin-top: 30px;

        padding-top: 25px;

        border-top: 1px solid #ddd;
      }

      .events-title {
        text-align: center;

        font-size: 22px;

        color: #000;

        margin-bottom: 8px;
      }

      .participant-details {
        text-align: center;

        color: #000;

        font-size: 14px;

        line-height: 1.7;

        margin-bottom: 20px;
      }

      /* BACK BUTTON */

      .back-btn {
        width: 100%;

        margin-top: 18px;

        padding: 12px;

        border: 1px solid #ccc;

        border-radius: 10px;

        background: white;

        color: #555;

        font-size: 14px;

        font-weight: 600;

        cursor: pointer;

        transition: 0.2s;
      }

      .back-btn:hover {
        background: #f5f5f5;
      }


      /* CLUB CARD BUTTON */
      .club-card-btn {
        width: 100%;
        margin-top: 12px;
        padding: 13px;
        border: none;
        border-radius: 10px;
        background: #563ed9;
        color: white;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.25s;
      }

      .club-card-btn:hover {
        background: #432bc0;
        transform: translateY(-1px);
      }

      /* MOBILE */

      @media (max-width: 600px) {
        body {
          padding: 15px;
        }

        .container {
          padding: 28px 22px;

          border-radius: 18px;
        }

        .club-title {
          font-size: 27px;
        }
      }
    </style>
  </head>

  <body>
    <div class="top-nav">
      <a href="index.html">← Home</a>
      <a href="club-card.html">🪪 Club Card</a>
    </div>

    <div class="container">
      <!-- HEADER -->

      <h1 class="club-title">𝓜𝓘 𝓒𝓛𝓤𝓑</h1>

      <p class="subtitle">Participant Registration</p>

      <!-- REGISTRATION FORM -->

      <form id="registrationForm">
        <div class="form-group">
          <label for="name"> Name </label>

          <input type="text" id="name" placeholder="Enter your name" required />
        </div>

        <div class="form-group">
          <label for="batch"> Batch </label>

          <select id="batch" required>
            <option value="">Select batch</option>
            <option value="2024-2027">2024 – 2027</option>
            <option value="2025-2028">2025 – 2028</option>
            <option value="2026-2029">2026 – 2029</option>
          </select>
        </div>

        <div class="form-group">
          <label for="domain"> Domain / Department </label>

          <select id="domain" required>
            <option value="">Select domain</option>
            <option value="CS">CS</option>
            <option value="AI">AI</option>
            <option value="BCA">BCA</option>
            <option value="DSA">DSA</option>
          </select>
        </div>

        <div class="form-group">
          <label for="regNumber"> Register Number </label>

          <div class="reg-number-row">
            <span class="reg-prefix" id="regPrefix">—</span>
            <input
              type="text"
              id="regNumber"
              placeholder="Enter remaining digits"
              required
            />
          </div>
        </div>

        <button type="submit" class="submit-btn">Submit Registration</button>
      </form>

      <!-- SUCCESS -->

      <div class="success-message" id="successMessage">
        ✅ Registration Submitted Successfully!
      </div>

      <!-- DIVIDER -->

      <div class="divider">OR</div>

      <!-- LOGIN -->

      <div class="login-section">
        <p>Already signed in?</p>

        <button type="button" class="login-btn" onclick="showLogin()">
          Login
        </button>
      </div>

      <!-- LOGIN FORM -->

      <div id="loginBox">
        <h2 class="login-title">Participant Login</h2>

        <div class="form-group">
          <label for="loginName"> Name </label>

          <input type="text" id="loginName" placeholder="Enter your name" />
        </div>

        <div class="form-group">
          <label for="loginBatch"> Batch </label>
          <select id="loginBatch">
            <option value="">Select batch</option>
            <option value="2024-2027">2024 – 2027</option>
            <option value="2025-2028">2025 – 2028</option>
            <option value="2026-2029">2026 – 2029</option>
          </select>
        </div>

        <div class="form-group">
          <label for="loginRegNumber"> Register Number </label>

          <input
            type="text"
            id="loginRegNumber"
            placeholder="Enter your register number"
          />
        </div>

        <button
          type="button"
          class="login-submit-btn"
          onclick="loginParticipant()"
        >
          Login
        </button>

        <div class="login-error" id="loginError">
          ❌ Invalid Name or Register Number
        </div>
      </div>

      <!-- PARTICIPATED EVENTS -->

      <div id="eventsBox">
        <h2 class="events-title">Welcome to MI Club</h2>

        <p class="participant-details" id="participantDetails"></p>

        <button type="button" class="club-card-btn" onclick="openClubCard()">
          🪪 Create / View Membership Card
        </button>

        <button type="button" class="club-card-btn" onclick="openEnrollment()">
          🎟️ Event Enrollment
        </button>

        <button type="button" class="back-btn" onclick="logoutParticipant()">
          ← Back
        </button>
      </div>
    </div>

    <script>
      /* ==========================================
   BACKEND URL
========================================== */

      const API_URL = "http://localhost:5000";

      /* ==========================================
   DOMAIN → REGISTER NUMBER PREFIX
========================================== */

      const DOMAIN_PREFIX = {
        CS: "c4s",
        AI: "a3s",
        BCA: "b2s",
        DSA: "d6s",
      };

      document.getElementById("domain").addEventListener("change", function () {
        const prefix = DOMAIN_PREFIX[this.value] || "—";
        document.getElementById("regPrefix").textContent = prefix;
      });

      /* ==========================================
   REGISTRATION
========================================== */

      document
        .getElementById("registrationForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          const name = document.getElementById("name").value.trim();

          const batch = document.getElementById("batch").value;

          const domain = document.getElementById("domain").value;

          const prefix = DOMAIN_PREFIX[domain] || "";

          const regNumberSuffix = document
            .getElementById("regNumber")
            .value.trim();

          const registerNumber = prefix + regNumberSuffix;

          if (!domain) {
            alert("❌ Please select a domain first.");
            return;
          }

          try {
            const response = await fetch(`${API_URL}/register`, {
              method: "POST",

              headers: {
                "Content-Type": "application/json",
              },

              body: JSON.stringify({
                name: name,

                registerNumber: registerNumber,

                batch: batch,

                domain: domain,
              }),
            });

            const data = await response.json();

            /* Registration failed */

            if (!response.ok) {
              alert("❌ " + data.message);

              return;
            }

            /* Registration successful */

            document.getElementById("successMessage").style.display = "block";

            document.getElementById("successMessage").innerHTML =
              "✅ Registration Submitted Successfully!";

            /* Clear form */

            document.getElementById("registrationForm").reset();

            document.getElementById("regPrefix").textContent = "—";

            /* Hide message */

            setTimeout(function () {
              document.getElementById("successMessage").style.display = "none";
            }, 4000);
          } catch (error) {
            console.error(error);

            alert(
              "❌ Cannot connect to server. " +
                "Please make sure backend is running.",
            );
          }
        });

      /* ==========================================
   SHOW LOGIN
========================================== */

      function showLogin() {
        document.getElementById("loginBox").style.display = "block";

        document.getElementById("eventsBox").style.display = "none";

        document.getElementById("loginBox").scrollIntoView({
          behavior: "smooth",
          block: "center",
        });
      }

      /* ==========================================
   LOGIN
========================================== */

      async function loginParticipant() {
        const loginName = document.getElementById("loginName").value.trim();

        const loginRegNumber = document
          .getElementById("loginRegNumber")
          .value.trim();

        const loginError = document.getElementById("loginError");

        try {
          const response = await fetch(`${API_URL}/login`, {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({
              name: loginName,
              batch: document.getElementById("loginBatch").value,
              registerNumber: loginRegNumber,
            }),
          });

          const data = await response.json();

          /* Invalid login */

          if (!response.ok) {
            loginError.style.display = "block";

            loginError.innerHTML = "❌ " + data.message;

            document.getElementById("eventsBox").style.display = "none";

            return;
          }

          /* Valid login */

          loginError.style.display = "none";

          const participant = data.participant;

          // Save logged-in participant for the Club Card page
          localStorage.setItem(
            "miClubParticipant",
            JSON.stringify(participant)
          );

          document.getElementById("eventsBox").style.display = "block";

          /* Participant details */

          document.getElementById("participantDetails").innerHTML =
            `<strong>${participant.name}</strong>
             <br>
             Register Number: ${participant.registerNumber}
             <br>
             Batch: ${participant.batch || "—"} · Domain: ${participant.domain || "—"}`;

          /* Scroll to events */

          document.getElementById("eventsBox").scrollIntoView({
            behavior: "smooth",
            block: "center",
          });
        } catch (error) {
          console.error(error);

          loginError.style.display = "block";

          loginError.innerHTML = "❌ Cannot connect to server.";
        }
      }

      /* ==========================================
   BACK / LOGOUT
========================================== */

      /* ==========================================
   OPEN CLUB CARD
========================================== */

      function openClubCard() {
        window.location.href = "club-card.html";
      }

      function openEnrollment() {
        window.location.href = "event-enrollment.html";
      }

      /* ==========================================
   BACK / LOGOUT
========================================== */

      function logoutParticipant() {
        document.getElementById("eventsBox").style.display = "none";

        document.getElementById("loginBox").style.display = "none";

        document.getElementById("loginName").value = "";
        document.getElementById("loginBatch").value = "";
        document.getElementById("loginRegNumber").value = "";

        document.getElementById("loginError").style.display = "none";
      }
    </script>
  </body>
</html>
